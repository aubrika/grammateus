name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  windows-installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: grammateus-windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
      # Pushing a tag such as v0.2.0 publishes the installer on the Releases page. latest.yml
      # and the .blockmap file are what an installed copy reads to find and fetch an update.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Grammateus ${version}" --generate-notes --prerelease
          gh release upload "$GITHUB_REF_NAME" "dist/Grammateus-Setup-${version}.exe" "dist/Grammateus-Setup-${version}.exe.blockmap" dist/latest.yml --clobber
