<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bulletin</title>
<link rel="stylesheet" href="bulletin.css">
<style>html, body { margin: 0; padding: 0; }</style>
</head>
<body>
<div id="pages"></div>
<script type="module">
  import { layoutBulletin } from "./layout.js";
  // ?doc=<url of bulletin.json>; pictures are found next to that file.
  const url = new URLSearchParams(location.search).get("doc");
  try {
    const doc = await (await fetch(url)).json();
    const base = url.slice(0, url.lastIndexOf("/") + 1);
    window.__report = await layoutBulletin(doc, document.getElementById("pages"), base);
  } catch (e) {
    window.__report = { error: String(e && e.stack || e) };
  }
</script>
</body>
</html>
