<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammateus</title>
<link rel="icon" href="../../build/icon.png">
<link rel="stylesheet" href="../renderer/bulletin.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="ui">
  <header id="bar">
    <button id="toggle" title="Show or hide the outline on the left" aria-pressed="true">☰</button>
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="20" fill="#66023C"/>
      <path transform="translate(50 50) scale(0.96)" fill="#D9B46A" d="M-5,-5 L-11,-28 L11,-28 L5,-5 L28,-11 L28,11 L5,5 L11,28 L-11,28 L-5,5 L-28,11 L-28,-11 Z"/>
    </svg>
    <span class="brand">Grammateus</span>
    <button id="new" title="Start an empty bulletin">New</button>
    <button id="open" title="Open a bulletin file">Open…</button>
    <button id="import" title="Make an editable bulletin from a finished bulletin PDF">Import PDF…</button>
    <button id="save" title="Save this bulletin">Save</button>
    <button id="saveas" title="Save a copy under a new name, for example for next Sunday">Save as…</button>
    <button id="undo" title="Undo the last change (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="pdf" class="primary" title="Make the PDF to send to the printer">Make PDF…</button>
    <span class="sep"></span>
    <span class="sheets" title="A folded bulletin is made of whole sheets of paper, four pages each.">
      Extra sheets: <button id="fewer">−</button><b id="extra">0</b><button id="more">+</button>
    </span>
    <span id="status" role="status"></span>
  </header>
  <main>
    <nav id="outline" aria-label="Parts of the bulletin"></nav>
    <section id="form" aria-label="Edit the selected part"></section>
    <section id="preview" aria-label="Preview of the pages"><div id="shown"></div></section>
  </main>
  <!-- shown over the screen while something slow is running, so it never looks frozen -->
  <div id="busy" hidden role="alertdialog" aria-live="polite" aria-busy="true">
    <div class="card">
      <!-- the cross stays still; only the quarter arc of the ring turns -->
      <div class="spinner" aria-hidden="true">
        <svg viewBox="-50 -50 100 100">
          <g class="ring">
            <circle class="track" r="41" fill="none" stroke="currentColor" stroke-width="6"/>
            <circle class="arc" r="41" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="64.4 193.2"/>
          </g>
          <path fill="currentColor" d="M-5,-5 L-11,-28 L11,-28 L5,-5 L28,-11 L28,11 L5,5 L11,28 L-11,28 L-5,5 L-28,11 L-28,-11 Z"/>
        </svg>
      </div>
      <div class="what">
        <div id="busytext">Working…</div>
        <progress id="busybar" max="100"></progress>
        <div id="busypct"></div>
      </div>
    </div>
  </div>
</div>
<!-- Pages at their true size. Laid out here, shown smaller in the preview, and printed from here. -->
<div id="pages"></div>
<datalist id="fonts"></datalist>
<input type="file" id="pickfile" accept=".bulletin,.json" hidden>
<input type="file" id="pickimage" accept="image/*" hidden>
<input type="file" id="pickpdf" accept="application/pdf,.pdf" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
